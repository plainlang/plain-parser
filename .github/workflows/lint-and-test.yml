name: Code Quality & Tests

on:
  # Pushes to PR branches are covered by pull_request; listening to every push
  # too would run the suite twice per commit. Pushes to main are covered by
  # the publish-dev-to-pypi workflow, which calls this one as a gate.
  pull_request:
  workflow_dispatch:
  # Lets the publish workflows run these checks as a job and depend on it.
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        id: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # Each check runs even if an earlier one failed, so one run reports
      # every failure.
      - name: Black Formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: black . --check
      - name: Import Sorting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: isort . --check-only --diff
      - name: Flake8 Linting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: flake8 .
      - name: MyPy Type Checking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy src
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest tests -v
