name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

jobs:
  pre-publish-checks:
    name: Pre-publish checks
    # Publishing is gated on the same checks PRs run: a red main must not
    # ship. Running here rather than as a separate workflow is the only way
    # to make the build job depend on the result.
    uses: ./.github/workflows/lint-and-test.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: pre-publish-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from git tags, so we need full history.
          fetch-depth: 0
          persist-credentials: false

      # Non-fatal: Slack being down must not block the release.
      - name: Notify Slack (start)
        if: ${{ vars.SLACK_CHANNEL_ID != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: Release `${{ github.ref_name }}` published by *${{ github.actor }}*
              — building and publishing to PyPI...

      - name: Install uv
        # uv provisions its own Python (honoring requires-python), so no
        # separate actions/setup-python step is needed.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Build package
        # hatch-vcs reads the version straight from the release tag.
        run: |
          uv build
          echo "Built distributions:"
          ls -l dist/

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Notify Slack (build failure)
        if: ${{ failure() && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: Build of `${{ github.ref_name }}` FAILED :x:. Nothing was published to PyPI.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

  upload-release-assets:
    name: Upload assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber

      - name: Notify Slack (upload failure)
        if: ${{ failure() && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: Uploading `${{ github.ref_name }}` to the GitHub Release FAILED :x:. Nothing was published to PyPI.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, upload-release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plain-parser
    permissions:
      # Mint a short-lived OIDC token so PyPI Trusted Publishing can
      # authenticate this run — no long-lived API token needed.
      id-token: write

    steps:
      # The tag (v0.2.0rc1) without its "v", for the install command in Slack.
      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # GitHub marks the release itself as a pre-release; the tag (v0.2.0rc1)
      # carries the same intent for PEP 440. pip and uv skip pre-releases by
      # default, so "--upgrade" would NOT pick one up. Tell people the command
      # that actually works.
      - name: Notify Slack (pre-release published)
        if: ${{ success() && github.event.release.prerelease && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: pre-release `${{ github.ref_name }}` published to PyPI :test_tube:.
              Normal installs are unaffected — try it with `pip install --pre plain-parser==${{ steps.version.outputs.version }}`.

      - name: Notify Slack (release published)
        if: ${{ success() && !github.event.release.prerelease && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: `${{ github.ref_name }}` published to PyPI :white_check_mark:.
              Install with `pip install --upgrade plain-parser`.

      - name: Notify Slack (failure)
        if: ${{ failure() && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: Publishing `${{ github.ref_name }}` to PyPI FAILED :x:.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.
