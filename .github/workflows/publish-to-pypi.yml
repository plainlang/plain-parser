name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

jobs:
  pre-publish-checks:
    name: Pre-publish checks
    # Publishing is gated on the same checks PRs run: a red main must not
    # ship. Running here rather than as a separate workflow is the only way
    # to make the build job depend on the result.
    uses: ./.github/workflows/lint-and-test.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: pre-publish-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The notify job replies in the start notice's thread.
      slack-ts: ${{ steps.slack-start.outputs.ts }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from git tags, so we need full history.
          fetch-depth: 0
          persist-credentials: false

      # Non-fatal: Slack being down must not block the release.
      - name: Notify Slack (start)
        id: slack-start
        if: ${{ vars.SLACK_CHANNEL_ID != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: Release `${{ github.ref_name }}` published by *${{ github.actor }}*
              — building and publishing to PyPI...

      - name: Install uv
        # uv provisions its own Python (honoring requires-python), so no
        # separate actions/setup-python step is needed.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Build package
        # hatch-vcs reads the version straight from the release tag.
        run: |
          uv build
          echo "Built distributions:"
          ls -l dist/

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  upload-release-assets:
    name: Upload assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, upload-release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plain-parser
    permissions:
      # Mint a short-lived OIDC token so PyPI Trusted Publishing can
      # authenticate this run — no long-lived API token needed.
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # End-of-run notices run in their own job: a failed Slack post fails only this
  # job, not the publish or its GitHub deployment, and "Re-run failed jobs"
  # re-posts without publishing again.
  notify:
    name: Notify Slack
    needs: [pre-publish-checks, build, upload-release-assets, publish-to-pypi]
    if: ${{ !cancelled() && vars.SLACK_CHANNEL_ID != '' }}
    runs-on: ubuntu-latest

    env:
      # Notices reply in the start notice's thread, quoted so YAML keeps the ts a
      # string. Without a start notice (its post failed or never ran) this is null,
      # which the Slack client drops, and they post to the channel. Failures are
      # also broadcast to the channel; success stays in the thread.
      THREAD_TS: ${{ needs.build.outputs.slack-ts && format('"{0}"', needs.build.outputs.slack-ts) || 'null' }}

    steps:
      - name: Notify Slack (checks failed)
        if: ${{ needs.pre-publish-checks.result == 'failure' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *plain-parser*: Release `${{ github.ref_name }}` halted — pre-publish checks FAILED :x:. Nothing was published to PyPI.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

      - name: Notify Slack (build failure)
        if: ${{ needs.build.result == 'failure' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            reply_broadcast: ${{ env.THREAD_TS != 'null' }}
            text: >-
              *plain-parser*: Build of `${{ github.ref_name }}` FAILED :x:. Nothing was published to PyPI.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

      - name: Notify Slack (upload failure)
        if: ${{ needs.upload-release-assets.result == 'failure' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            reply_broadcast: ${{ env.THREAD_TS != 'null' }}
            text: >-
              *plain-parser*: Uploading `${{ github.ref_name }}` to the GitHub Release FAILED :x:. Nothing was published to PyPI.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

      - name: Notify Slack (failure)
        if: ${{ needs.publish-to-pypi.result == 'failure' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            reply_broadcast: ${{ env.THREAD_TS != 'null' }}
            text: >-
              *plain-parser*: Publishing `${{ github.ref_name }}` to PyPI FAILED :x:.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

      # The tag (v0.2.0rc1) without its "v", for the install command below.
      - name: Version from tag
        id: version
        if: ${{ needs.publish-to-pypi.result == 'success' }}
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # GitHub marks the release itself as a pre-release; the tag (v0.2.0rc1)
      # carries the same intent for PEP 440. pip and uv skip pre-releases by
      # default, so "--upgrade" would NOT pick one up. Tell people the command
      # that actually works.
      - name: Notify Slack (pre-release published)
        if: ${{ needs.publish-to-pypi.result == 'success' && github.event.release.prerelease }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            text: >-
              *plain-parser*: pre-release `${{ github.ref_name }}` published to PyPI :test_tube:.
              Normal installs are unaffected — try it with `pip install --pre plain-parser==${{ steps.version.outputs.version }}`.

      - name: Notify Slack (release published)
        if: ${{ needs.publish-to-pypi.result == 'success' && !github.event.release.prerelease }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            text: >-
              *plain-parser*: `${{ github.ref_name }}` published to PyPI :white_check_mark:.
              Install with `pip install --upgrade plain-parser`.

      # Success also puts a ✅ on the start notice, so the result shows in the
      # channel without another message. Needs the app's reactions:write scope.
      # Non-fatal: the result is already posted, and a re-run gets already_reacted.
      - name: Notify Slack (✅ on the start notice)
        if: ${{ needs.publish-to-pypi.result == 'success' && env.THREAD_TS != 'null' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: reactions.add
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            timestamp: ${{ env.THREAD_TS }}
            name: white_check_mark
