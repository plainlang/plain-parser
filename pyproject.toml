[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "plain-parser"
dynamic = ["version"]
description = "Parser for ***plain specification files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "python-liquid2>=0.4.0,<0.5",
    "mistletoe>=1.6.0,<2",
    "python-frontmatter>=1.3.0,<2",
    "networkx>=3.6.1,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "flake8==7.3.0",
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.3.0",
]

[project.scripts]
plain-parser = "plain_parser.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/plain_parser"]

[tool.black]
line-length = 120
target-version = ['py311']
extend-exclude = '''
^/(.git|.venv|dist|tests/data)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", ".venv", "dist", "tests/data"]
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
disable_error_code = [
    "var-annotated", "import-untyped", "assignment", "return-value", "attr-defined",
    "no-redef", "func-returns-value", "override", "index", "union-attr", "valid-type",
    "misc", "operator", "unreachable", "has-type", "return", "type-arg",
]
exclude = ["^\\.git/", "^\\.venv/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
norecursedirs = ["tests/data"]
